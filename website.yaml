AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Project 1 - EC2 web server fronted by CloudFront. Only visitors in Africa and Asia
  are allowed (CloudFront geo restriction). Custom domain via Route 53 is optional.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into (the default VPC is fine).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A PUBLIC subnet in that VPC.
  InstanceType:
    Type: String
    Default: t3.micro
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: 'pl-[0-9a-f]+'
    Description: >
      Region-specific ID of the AWS-managed prefix list for CloudFront origin-facing servers.
      Find it with: aws ec2 describe-managed-prefix-lists
      --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
      --query "PrefixLists[0].PrefixListId" --output text
  AllowedCountries:
    Type: CommaDelimitedList
    Default: "DZ,AO,BJ,BW,BF,BI,CV,CM,CF,TD,KM,CG,CD,CI,DJ,EG,GQ,ER,SZ,ET,GA,GM,GH,GN,GW,KE,LS,LR,LY,MG,MW,ML,MR,MU,MA,MZ,NA,NE,NG,RW,ST,SN,SC,SL,SO,ZA,SS,SD,TZ,TG,TN,UG,ZM,ZW,EH,RE,YT,SH,AF,AM,AZ,BH,BD,BT,BN,KH,CN,CY,GE,HK,IN,ID,IR,IQ,IL,JP,JO,KZ,KW,KG,LA,LB,MO,MY,MV,MN,MM,NP,KP,OM,PK,PS,PH,QA,SA,SG,KR,LK,SY,TW,TJ,TH,TL,TR,TM,AE,UZ,VN,YE"
    Description: ISO 3166-1 alpha-2 country codes allowed to view the site (Africa + Asia by default).
  DomainName:
    Type: String
    Default: ""
    Description: OPTIONAL. Custom domain, e.g. shop.example.com. Leave empty to use the CloudFront URL.
  HostedZoneId:
    Type: String
    Default: ""
    Description: OPTIONAL. Route 53 hosted zone ID that contains DomainName.
  CertificateArn:
    Type: String
    Default: ""
    Description: OPTIONAL. ACM certificate ARN for DomainName. It MUST be issued in us-east-1.

Conditions:
  UseDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing servers only
      Tags:
        - Key: Name
          Value: capstone1-web-sg

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet: [!Ref WebSecurityGroup]
      Tags:
        - Key: Name
          Value: capstone1-web
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # EC2 user data: installs Apache and publishes a small demo storefront.
          dnf update -y
          dnf install -y httpd
          systemctl enable --now httpd

          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

          cat > /var/www/html/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Demo Store | Africa &amp; Asia</title>
            <style>
              body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1c2430}
              header{background:#0b3d5c;color:#fff;padding:2rem 1rem;text-align:center}
              main{max-width:880px;margin:2rem auto;padding:0 1rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
              .card{background:#fff;border-radius:10px;padding:1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}
              footer{text-align:center;color:#667;font-size:.85rem;padding:2rem}
            </style>
          </head>
          <body>
            <header><h1>Demo Store</h1><p>Available to customers in Africa and Asia</p></header>
            <main>
              <div class="card"><h3>Kitenge Tote</h3><p>USD 18</p></div>
              <div class="card"><h3>Handwoven Basket</h3><p>USD 25</p></div>
              <div class="card"><h3>Silk Scarf</h3><p>USD 32</p></div>
            </main>
            <footer>Served from EC2 in $AZ through Amazon CloudFront</footer>
          </body>
          </html>
          EOF

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Capstone 1 - geo-restricted EC2 website
        Aliases: !If [UseDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        Origins:
          - Id: ec2-origin
            DomainName: !GetAtt WebServer.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        Restrictions:
          GeoRestriction:
            RestrictionType: whitelist
            Locations: !Ref AllowedCountries
        ViewerCertificate: !If
          - UseDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: UseDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed ID for all CloudFront distributions

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: UseDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontUrl:
    Value: !Sub https://${Distribution.DomainName}
  SiteUrl:
    Value: !If [UseDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  OriginPublicDns:
    Description: Direct hits on this should time out, because the security group only allows CloudFront.
    Value: !GetAtt WebServer.PublicDnsName
