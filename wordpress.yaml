AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Project 4 - WordPress on a single EC2 instance (Apache, PHP, MariaDB) with an Elastic IP
  and an optional Route 53 DNS record.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A PUBLIC subnet in that VPC.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AdminCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    Description: Your public IP in /32 form for SSH, e.g. 203.0.113.25/32.
  InstanceType:
    Type: String
    Default: t3.small
    Description: t3.micro works but WordPress is more comfortable with 2 GiB of RAM.
  DomainName:
    Type: String
    Default: ""
    Description: OPTIONAL. e.g. shop.example.com
  HostedZoneId:
    Type: String
    Default: ""
    Description: OPTIONAL. Route 53 hosted zone ID that contains DomainName.

Conditions:
  UseDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  WordPressSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WordPress - HTTP/HTTPS from anywhere, SSH from the admin only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr}
      Tags: [{Key: Name, Value: capstone4-wordpress-sg}]

  WordPressServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet: [!Ref WordPressSG]
      Tags: [{Key: Name, Value: capstone4-wordpress}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # EC2 user data for Amazon Linux 2023: installs a complete WordPress stack (Apache + PHP + MariaDB).
          # The database password is generated on the server and never stored in this repo.
          set -euxo pipefail

          dnf update -y
          dnf install -y wget httpd php-fpm php-mysqli php-json php php-gd php-mbstring php-xml mariadb105-server

          systemctl enable --now mariadb httpd php-fpm

          # --- Database -------------------------------------------------------------
          DB_PASS=$(openssl rand -hex 16)
          mysql <<SQL
          CREATE DATABASE IF NOT EXISTS wordpress;
          CREATE USER IF NOT EXISTS 'wpuser'@'localhost' IDENTIFIED BY '$DB_PASS';
          GRANT ALL PRIVILEGES ON wordpress.* TO 'wpuser'@'localhost';
          FLUSH PRIVILEGES;
          SQL

          # --- WordPress files ------------------------------------------------------
          cd /tmp
          wget -q https://wordpress.org/latest.tar.gz
          tar -xzf latest.tar.gz
          cp -r wordpress/* /var/www/html/
          cd /var/www/html
          cp wp-config-sample.php wp-config.php
          sed -i "s/database_name_here/wordpress/; s/username_here/wpuser/; s/password_here/$DB_PASS/" wp-config.php

          # Replace the 8 placeholder security keys/salts with random values
          for i in 1 2 3 4 5 6 7 8; do
            sed -i "0,/put your unique phrase here/s//$(openssl rand -hex 32)/" wp-config.php
          done

          # Allow pretty permalinks (.htaccess) and set permissions
          sed -i '/<Directory "\/var\/www\/html">/,/<\/Directory>/ s/AllowOverride None/AllowOverride All/' /etc/httpd/conf/httpd.conf
          chown -R apache:apache /var/www/html
          find /var/www/html -type d -exec chmod 755 {} \;
          find /var/www/html -type f -exec chmod 644 {} \;

          systemctl restart httpd php-fpm

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WordPressServer
      Tags: [{Key: Name, Value: capstone4-wordpress-eip}]

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: UseDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: '300'
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  SiteUrl:
    Description: Open this to run the WordPress installer (give it 3-5 minutes after the stack finishes).
    Value: !If [UseDomain, !Sub 'http://${DomainName}', !Sub 'http://${ElasticIp}']
  ElasticIpAddress:
    Value: !Ref ElasticIp
  SshCommand:
    Value: !Sub ssh -i <your-key>.pem ec2-user@${ElasticIp}
